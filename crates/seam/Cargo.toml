[package]
name = "nexus-flow-seam"
version.workspace = true
edition = "2021"
description = "v2's library seam (RFC 0001): the crate an embedder links, under a temporary name until the cut-over (NEX-194)"
publish = false

# Depends on `store` and on nothing of v1 (RFC 0001, "The library seam"). It reaches NoCentralDB only
# through `store`.
[dependencies]
nexus-flow-store = { path = "../store" }
# Installing the shipped defaults (RFC 0006, NEX-132): `shipped.toml` is read with serde and toml,
# and every shipped version is recognised by its SHA-256.
serde.workspace = true
sha2 = "0.10"
toml.workspace = true

# The store's test helpers, for the tests of the crates above the seam (`nxs-v2`), which reach
# the store only through it; never enabled in a build that ships.
[features]
test-support = ["nexus-flow-store/test-support"]

# The seam's own tests make invitations with the store's test helpers.
[dev-dependencies]
nexus-flow-store = { path = "../store", features = ["test-support"] }
