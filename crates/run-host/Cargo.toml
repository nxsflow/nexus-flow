[package]
name = "nexus-run-host"
version.workspace = true
edition = "2021"
description = "The host of the nxc run engine: the per-run owner lease, the tick, effect execution with its ledger, timers, the tree worker and the bridge entry points"
publish = false

# Its row in `cargo xtask layering check` holds this list. Nothing from the old engine, ever.
[dependencies]
nexus-run-contracts = { path = "../run-contracts" }
nexus-run-engine = { path = "../run-engine" }
nexus-run-store-sqlite = { path = "../run-store-sqlite" }
nexus-run-session-claude = { path = "../run-session-claude" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"

# The crash harness's home (§11): reachable from dev-dependencies only, which the gate holds.
[features]
test-support = []

# The self edge turns `test-support` on for this crate's own tests, so a plain `cargo test --all` in CI
# RUNS them: `required-features` alone would skip every one in silence. rusqlite: what a test does to
# the file behind the store's back, holding the write lock and damaging a row.
[dev-dependencies]
nexus-run-host = { path = ".", features = ["test-support"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
tempfile = "3"

[[bin]]
name = "run-host-crashbox"
path = "src/bin/run-host-crashbox.rs"
required-features = ["test-support"]
