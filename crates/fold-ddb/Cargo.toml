[package]
name = "nxs-fold-ddb"
version.workspace = true
edition = "2021"
description = "Folding on a server (6j6v.vvw6): the reducers' described changes carried out against DynamoDB, the board's active, dated and typed indexes, next/blocked and a ranked list over them, snapshots as tables plus watermark"
publish = false

[features]
default = []
# The DynamoDB half: `DynamoDbTable` over the AWS SDK and the table definition. Opt-in for the
# reason `nxs-server`'s own `dynamodb` feature is: the SDK pulls `aws-lc-sys`, a native C build that
# needs a C toolchain and `cmake`, and the default `cargo test --all` must not. Everything else in
# this crate — the layout, the write plan, the board index, the in-memory table the tests fold
# into, snapshots — builds without it, so the rules are tested on every run and only the SDK
# adapter waits for the `dynamodb-local` CI job.
dynamodb = ["dep:aws-sdk-dynamodb", "dep:aws-config", "dep:tokio"]
# Test seams of the board-fold purge (6j6v.dbmd): `PurgeSeams::from_env` and the stop, inject and
# page seams it reads (`NXF_FOLD_TEST_PURGE_*`). Off in every shipped build: only this package's
# own dev-dependency on itself (below) turns it on, so `nxf-fold-purge` as foundations build it
# (`cargo build -p nxs-fold-ddb --bin nxf-fold-purge --features dynamodb`) never reads them — CI
# and the release workflow prove that on such a build (`scripts/fold-purge-seam-inertness.sh`).
test-seams = []

[[bin]]
# The board-fold purge (6j6v.dbmd): one stream's partition of the board-fold table, deleted the way
# `nxf-relay purge` deletes the relay's (6j6v.f6yb). Not part of any release tarball: the
# consuming stack builds it from the same pin as its board-fold (`purge` module doc).
name = "nxf-fold-purge"
path = "src/bin/nxf-fold-purge.rs"
required-features = ["dynamodb"]

[dependencies]
nxs-foundation = { path = "../foundation" }
nexus-flow-core = { path = "../core" }
# The engine only — no CLI or onboarding closure (see nexus-chat's `cli` feature).
nexus-chat = { path = "../chat", default-features = false }
nexus-memory = { path = "../memory" }
# The store-free lanes and the record (6j6v.t1ym): `records::active_board` builds the facade's
# neutral input, and the facade ranks and projects it — the one mechanism a replica runs. The facade
# does not depend on this crate (it knows no DynamoDB); this edge points the other way.
nexus-flow-facade = { path = "../facade" }
# `records::active_board` reads its tickets' joins a bounded number at a time (`StreamExt::buffered`)
# instead of one request after the other. Already in the build through the AWS SDK.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The purge's plan and identity digests and its log-id v1 copy (6j6v.dbmd; the same three crates
# `nxs-server` uses for its own, so nothing new enters the build).
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
# `default-features = false` drops the SDK's deprecated `rustls` feature (6j6v.2dn0): it switches on
# the LEGACY hyper-0.14 client, and with it rustls 0.21, rustls-webpki 0.101 and h2 0.3 — three
# crates with open RustSec advisories that `cargo deny` refuses. `default-https-client` is the
# hyper-1 / rustls-0.23 client the SDK uses either way; `rt-tokio` is the other default kept.
aws-sdk-dynamodb = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
# `nxf-fold-purge` only: the SDK's standard credential chain, and the runtime the bin awaits on.
aws-config = { version = "1", optional = true, features = ["behavior-version-latest"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# The based-snapshot differential (nxf 6j6v.0cfa) takes ONE format-2 snapshot and starts both a
# SQLite replica and this crate's table from it, so it must speak the envelope the sync crate owns.
# DEV-only, and the edge points this way on purpose: the format belongs to `nxs-sync`, the
# projection of its views onto a server table belongs here (`snapshot::from_image`), and the library
# needs nothing of the envelope to do that.
nxs-sync = { path = "../sync", features = ["engine"] }
# The records differential test (6j6v.t1ym) parses a plugin fixture that declares a custom field.
toml = "0.8"
# The derived-keys differential test (6j6v.1c5s) registers its plugin fixture, so `plugin::load`
# validates it as it validates a consumer's plugin.
inventory = "0.3"
# The purge (6j6v.dbmd): this package with its test seams on, as nxs-server does for its own; and
# nxs-server itself, so the parity tests hold `purge::validate_purge_id` and the log-id copy equal
# to the relay's (design MF-1). DEV-only: the library never depends on the relay.
nxs-fold-ddb = { path = ".", features = ["test-seams"] }
nxs-server = { path = "../server" }
