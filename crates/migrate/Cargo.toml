[package]
name = "nexus-flow-migrate"
version.workspace = true
edition = "2021"
description = "The move of a v1 workspace into NoCentralDB (RFC 0008)"
publish = false

# What NEX-177 reads a v1 workspace with: `.nxs/db.sqlite` through SQLite, never v1's `Store::open`,
# and `replica.toml`, `config.toml` and `sync.toml` through TOML. Declared here so that the lockfile
# settles in NEX-212 and not in the ticket after it.
[dependencies]
rusqlite.workspace = true
serde.workspace = true
toml.workspace = true

# v1's foundation, for the tests only: they check that v1's own `assess_open` refuses a workspace the
# move has marked (NEX-180). The crate itself reads v1's data by its format and links no v1 crate,
# which `tests/skeleton.rs` checks.
[dev-dependencies]
nxs-foundation = { path = "../foundation" }
