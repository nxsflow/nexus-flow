[package]
name = "nexus-run-session-claude"
version.workspace = true
edition = "2021"
description = "The Claude adapter of the nxc run engine: spawns the sidecar in facts mode into its own process group, reads its facts from the session ledger, samples its processes and signals it through the identity guard"
publish = false

# Its row in `cargo xtask layering check` holds this list, and it is the only row that holds `libc`.
[dependencies]
nexus-run-contracts = { path = "../run-contracts" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
