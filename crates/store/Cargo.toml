[package]
name = "nexus-flow-store"
version.workspace = true
edition = "2021"
description = "nexus-flow's storage crate under the library seam: the only crate that depends on the NoCentralDB SDK (RFC 0001)"
publish = false

# The only crate of the workspace that depends on the SDK (RFC 0001, "The dependency on
# NoCentralDB"): a change in NoCentralDB's API at a pin move touches this crate alone. The pin
# itself is in the workspace Cargo.toml.
[dependencies]
nocentraldb.workspace = true
# Reads and writes nexus-flow.toml (RFC 0001, "Creating and finding a space"), at the version the
# workspace already declares.
toml.workspace = true

# The test helpers the crates above the store use for members nexus-flow cannot start yet
# (`testing`); never enabled in a build that ships. The store's own tests have them without it.
[features]
test-support = []
