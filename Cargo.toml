[workspace]
resolver = "2"
members = ["crates/foundation", "crates/core", "crates/facade", "crates/cli", "crates/memory", "crates/chat", "crates/nxs", "crates/nxs-init", "crates/nxs-ui", "crates/guide", "crates/sync", "crates/service", "crates/server", "crates/fold-ddb", "crates/plugin-probe", "crates/test-support", "crates/run-contracts", "crates/run-engine", "crates/run-store-sqlite", "crates/run-session-claude", "crates/run-host", "crates/store", "crates/seam", "crates/nxs-v2", "crates/merge-gate", "crates/migrate", "xtask"]
# The Tauri example links the engine as a real embedding host. It is kept OUT of the workspace so
# `cargo test`/CI never build Tauri + WebKit; it builds standalone from its own dir. Being out of
# the workspace is also how it silently rotted for seven weeks (a facade signature moved under
# it), so `.github/workflows/example-check.yml` runs `cargo check` on it by itself.
# See examples/tauri-board/README.md.
exclude = ["examples/tauri-board/src-tauri"]

# Single source of truth for the shipped version. Product crates inherit it via
# `version.workspace = true`; `nxf --version` reports it through CARGO_PKG_VERSION
# (clap). The release tag `v<version>` is the truth and CI enforces tag == version
# fail-closed. See docs/specs/release-management.md §4.1.
[workspace.package]
version = "0.224.0"

# NoCentralDB's Rust SDK (RFC 0001, "The dependency on NoCentralDB"; the owner's answer in
# NEX-211): from crates.io at one exact version. The pin moves deliberately, one pull request per
# move that carries nothing else, and waits for the owner. Only `crates/store` depends on it.
# `cargo test -p xtask sdk_pin` fails on any other form of this entry.
[workspace.dependencies]
nocentraldb = "=0.1.0-beta.1"

# What the v2 crates after NEX-212 build with, declared once here so that those tickets touch neither
# this file nor the lockfile: NEX-97 (nxs-v2: clap, serde, serde_json), NEX-169 (merge-gate:
# pulldown-cmark) and NEX-177 (migrate: rusqlite, serde, toml). The versions are the ones v1's crates
# already resolve, so the lockfile gains no second copy; pulldown-cmark is new to the workspace.
clap = { version = "4", features = ["derive"] }
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Trim the debug build cache (nexus-flow-k1i). `target/debug` had grown to ~24 GB of `.o`/DWARF
# in `deps/` because the default `debug = true` emits FULL debug info — and on macOS
# `split-debuginfo = "unpacked"` keeps it in the per-object files. `line-tables-only` keeps the
# file:line tables, so backtraces (and `cargo test` failures) still point at real source
# locations; only full variable inspection in a debugger (lldb stepping — not how this project is
# tested) is dropped. It roughly halves `debug/`. This is the `debug=` (DWARF) knob ONLY: it does
# NOT touch `cfg(debug_assertions)`, so `debug_assert!` and `cargo test --release` (which gates on
# `debug_assertions`, not `debug=`) behave exactly as before. The release profile is untouched —
# zero user/runtime impact. For the OTHER half of the bloat (accumulated stale incremental +
# dep artifacts that cargo never auto-prunes), prune periodically with cargo-sweep instead of a
# full `cargo clean` — see the "Build cache" note in CLAUDE.md.
[profile.dev]
debug = "line-tables-only"

# Optimise every THIRD-PARTY crate in the dev/test profile (nxf 6j6v.vewv). Measured on main run
# 41648455950: `Tests (debug)` took 54 min of which 52.7 min was test EXECUTION (the warm compile
# was 1m35s), and one binary — fold-ddb's `based_differential` — took 1731 s against 64 s in the
# release run. A sample of that binary in debug put ~35% of its CPU in curve25519-dalek / sha2
# (ed25519 signing of every generated op) and ~35% in the bundled SQLite's C parser and VM, both
# built at -O0. Neither is workspace code, so they are optimised here and nothing else changes:
# `"*"` matches NON-workspace packages only, so every workspace crate still builds at opt-level 0
# with incremental compilation, and `debug-assertions` / `overflow-checks` stay ON for all of it —
# the debug test run keeps catching what it exists to catch (a `debug_assert!` firing, an
# overflow). The cost is paid once per dependency build and is held by the cache afterwards.
[profile.dev.package."*"]
opt-level = 2
