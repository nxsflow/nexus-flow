name: dependency-audit

# The dependency vulnerability gate (nexus-flow-6j6v.2dn0). The process around it — who is told,
# the response time per severity, how an exception is recorded and what evidence is kept — is
# docs/runbooks/dependency-vulnerabilities.md. Red means: a dependency that SHIPS has an advisory
# that is neither fixed nor recorded, or a recorded exception has run out.
#
# What it checks, and why each half is here:
#   - `cargo deny check` (deny.toml): RustSec advisories (vulnerable, unsound, unmaintained,
#     yanked) against every crate a shipped artifact links, under every feature; plus the license
#     allow-list, the bans and the allowed sources.
#   - `cargo xtask deps exceptions`: every ignore entry in deny.toml carries an expiry and a board
#     item, and the expiry has not passed. cargo-deny itself has no notion of an expiry.
#   - `cargo xtask deps npm-audit`: `npm audit --omit=dev` for the npm packages that ship — the
#     agent sidecar, whose bundle is compiled into `nxs`, and the `@nexus-flow/mcp` runner shim,
#     which must stay free of runtime dependencies or bring a lockfile to audit.
on:
  # ci.yml calls this as its `dependency-audit` job, so every change — push, pull request,
  # dispatch — runs the same steps this file runs on its own schedule.
  workflow_call:
  # DAILY, because an advisory is published without anybody touching this tree: the gate that only
  # runs on a change would stay green over a known vulnerability for as long as nobody pushes.
  # GitHub notifies the account that last edited this cron line when a scheduled run fails — the
  # runbook makes that account the first recipient.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Prebuilt binary (no compile), the same route facade-semver.yml takes for its tool.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Every check below runs even when one before it went red (`!cancelled()`), so one red run
      # names every open finding at once instead of one per round trip.
      - name: cargo deny check (advisories, licenses, bans, sources)
        run: cargo deny check

      - name: Recorded advisory exceptions are dated, attributed and not expired
        if: ${{ !cancelled() }}
        run: cargo xtask deps exceptions

      - uses: actions/setup-node@v5
        if: ${{ !cancelled() }}
        with:
          node-version: "22"

      # The sidecar's bundle is part of every `nxs` binary, so its production dependencies are
      # shipped dependencies. `npm audit` reads the lockfile only; no `npm ci` is needed.
      - name: npm audit — agent sidecar (bundled into nxs)
        if: ${{ !cancelled() }}
        run: cargo xtask deps npm-audit agent-sidecar

      - name: npm audit — @nexus-flow/mcp runner shim
        if: ${{ !cancelled() }}
        run: cargo xtask deps npm-audit npm/mcp
