name: tv58 throwaway process probe
# Throwaway (6j6v.tv58 step 0): the real CLI on Linux, against a local fake Messages API. Removed before the hand-over.
on:
  push:
    branches: [feat/tv58-claude-adapter]
    paths: [".github/tv58-probe/**", ".github/workflows/tv58-probe.yml", "crates/run-session-claude/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Sidecar bundle
        working-directory: agent-sidecar
        run: |
          npm ci
          npm run build
      - name: The real bundle under the real adapter
        run: cargo test -p nexus-run-session-claude --test real_sidecar -- --ignored --test-threads=1 --nocapture
      - name: The real adapter's other real-process tests
        run: cargo test -p nexus-run-session-claude -p nexus-run-host --test stop --test sample --test reattach --test ledger --test real_backend --test tree_review_fixes
